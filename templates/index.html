<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lomba Video Downloader</title>
<link rel="icon" type="image/x-icon" href="/static/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="/static/favicon.png">
<link rel="apple-touch-icon" href="/static/favicon.png">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#131315">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#131315; --panel:#1C1C1F; --panel-2:#26262A; --line:#37373D;
    --text:#F3F1EA; --muted:#A0A0A8;
    --gold:#FED063; --gold-hover:#FFE08F; --on-gold:#131315;
    --error:#FF8A7A;
    --font:"Poppins","Segoe UI",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--text);font:400 16px/1.55 var(--font);min-height:100vh}
  main{max-width:960px;margin:0 auto;padding:56px 20px 80px}
  .header-brand{display:flex;align-items:center;gap:20px;margin:0 0 28px}
  .brand-logo{width:68px;height:68px;object-fit:contain;filter:drop-shadow(0 4px 18px rgba(254,208,99,0.35));flex-shrink:0}
  h1{font:700 clamp(2.2rem,5vw,3.4rem)/1.1 var(--font);letter-spacing:-.02em;margin:0 0 6px;color:var(--gold)}
  .sub{color:var(--muted);margin:0;max-width:56ch}

  .bar{display:flex;border:2px solid var(--line);background:var(--panel);border-radius:14px;overflow:hidden}
  .bar:focus-within{border-color:var(--gold)}
  .bar input{flex:1;min-width:0;border:0;background:transparent;padding:18px 18px;font:inherit;color:var(--text);outline:none}
  .bar input::placeholder{color:#6F6F78}
  .bar button{border:0;background:var(--gold);color:var(--on-gold);font:600 1rem var(--font);padding:0 30px;cursor:pointer}
  .bar button:hover{background:var(--gold-hover)}
  .bar button:focus-visible{outline:3px solid var(--text);outline-offset:-3px}
  .bar button:disabled{opacity:.55;cursor:progress}
  .hint{font-size:.85rem;color:var(--muted);margin:10px 2px 0}
  #msg{min-height:1.5em;margin:14px 2px 0;font-weight:500;color:var(--gold)}
  #msg.err{color:var(--error)}

  #result{display:none;margin-top:28px;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:28px;align-items:start}
  #result.show{display:grid}
  .video img{width:100%;border-radius:12px;display:block;background:#000;aspect-ratio:16/9;object-fit:cover}
  .video h2{font:600 1.3rem/1.3 var(--font);margin:16px 0 6px;color:var(--text)}
  .video p{margin:0;color:var(--muted);font-size:.95rem}

  table{width:100%;border-collapse:separate;border-spacing:0;background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  th{font:500 .85rem var(--font);text-align:left;color:var(--muted);padding:13px 18px;border-bottom:1px solid var(--line);background:var(--panel-2)}
  td{padding:13px 18px;border-bottom:1px solid var(--line);vertical-align:middle;font-weight:500}
  tr:last-child td{border-bottom:0}
  td.size{color:var(--muted);font-size:.9rem;font-weight:400;white-space:nowrap}
  td.act{text-align:right}
  a.dl{display:inline-block;background:var(--gold);color:var(--on-gold);text-decoration:none;font-weight:600;padding:9px 18px;border-radius:9px}
  a.dl:hover{background:var(--gold-hover)}
  a.dl:focus-visible{outline:3px solid var(--text);outline-offset:2px}
  a.dl.busy{background:var(--panel-2);color:var(--gold);pointer-events:none}

  @media (max-width:760px){
    .header-brand{flex-direction:column;align-items:flex-start;gap:14px;margin-bottom:24px}
    .brand-logo{width:56px;height:56px}
    #result.show{grid-template-columns:1fr}
    .bar{flex-direction:column}
    .bar button{padding:14px}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
  <div class="header-brand">
    <img src="/static/logo.png" alt="Lomba Logo" class="brand-logo">
    <div>
      <h1>Lomba Video Downloader</h1>
      <p class="sub">Paste a link, pick a quality, and save the file. For videos you own or have permission to download.</p>
    </div>
  </div>

  <div class="bar" role="search">
    <input id="url" type="url" placeholder="Paste any video link (YouTube, TikTok, Twitter/X, Instagram, Vimeo, etc.)..." aria-label="Video link" autocomplete="off">
    <button id="go">Get video</button>
  </div>
  <p class="hint">Supports YouTube, TikTok, Instagram, Twitter/X, Vimeo, Facebook, and 1,000+ sites. When you click Download, you can choose where to save your file.</p>
  <div id="msg" role="status" aria-live="polite"></div>

  <section id="result" aria-label="Download options">
    <div class="video">
      <img id="thumb" alt="">
      <h2 id="title"></h2>
      <p id="meta"></p>
    </div>
    <table>
      <thead><tr><th>Format</th><th>Size</th><th></th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
const msg = (t, err=false) => { $('msg').textContent = t; $('msg').className = err ? 'err' : ''; };

function duration(s){
  if(!s) return '';
  const h = Math.floor(s/3600), m = Math.floor(s%3600/60), sec = s%60;
  const p = n => String(n).padStart(2,'0');
  return h ? `${h}:${p(m)}:${p(sec)}` : `${m}:${p(sec)}`;
}

async function fetchInfo(){
  const url = $('url').value.trim();
  if(!url){ msg('Paste a video link first.', true); return; }
  $('go').disabled = true; $('result').classList.remove('show');
  msg('Fetching video details...');
  try{
    const r = await fetch('/api/info', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({url})});
    const d = await r.json();
    if(!r.ok) throw new Error(d.error || 'Could not read that link.');
    render(d, url);
    msg('');
  }catch(e){ msg(e.message, true); }
  finally{ $('go').disabled = false; }
}

const sleep = ms => new Promise(r => setTimeout(r, ms));

function render(d, url){
  $('thumb').src = d.thumbnail || '';
  $('title').textContent = d.title || 'Untitled';
  $('meta').textContent = [d.uploader, duration(d.duration)].filter(Boolean).join('  |  ');
  const rows = $('rows'); rows.innerHTML = '';
  d.options.forEach(o => {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${o.label}</td><td class="size">${o.size || ''}</td><td class="act"><a class="dl" href="#" role="button">Download</a><a class="cancel" href="#" role="button" style="display:none; margin-left:15px; color:var(--error); font-weight:600; text-decoration:none;">Cancel</a></td>`;
    const a = tr.querySelector('a.dl');
    const c = tr.querySelector('a.cancel');
    a.addEventListener('click', e => { e.preventDefault(); startDownload(a, c, url, o, d.title); });
    rows.appendChild(tr);
  });
  $('result').classList.add('show');
}

// Start a server job, prompt for save location, and save when done.
async function startDownload(a, c, url, o, videoTitle){
  if(a.classList.contains('busy')) return;

  const ext = o.kind === 'audio' ? 'mp3' : 'mp4';
  const cleanTitle = (videoTitle || 'video').replace(/[/\\?%*:|"<>]/g, '_').trim().slice(0, 100) || 'video';
  const suggestedName = `${cleanTitle}.${ext}`;

  let fileHandle = null;
  if(window.showSaveFilePicker){
    try{
      fileHandle = await window.showSaveFilePicker({
        suggestedName: suggestedName,
        types: [{
          description: o.kind === 'audio' ? 'MP3 Audio' : 'MP4 Video',
          accept: {
            [o.kind === 'audio' ? 'audio/mpeg' : 'video/mp4']: ['.' + ext]
          }
        }]
      });
    }catch(err){
      if(err.name === 'AbortError') return; // User cancelled the save dialog
      console.warn('showSaveFilePicker fallback:', err);
    }
  }

  a.classList.add('busy'); a.textContent = 'Starting...';
  
  let cancelled = false;
  let job = null;
  const onCancel = async (e) => {
    e.preventDefault();
    cancelled = true;
    if (job) await fetch('/api/cancel/' + job, {method:'POST'});
  };
  c.style.display = 'inline-block';
  c.addEventListener('click', onCancel);

  try{
    const body = {url, kind:o.kind, height:o.height};
    while(!job){
      if(cancelled) throw new Error('Download cancelled by user.');
      try{
        const r = await fetch('/api/prepare', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
        const d = await r.json();
        if(!r.ok) throw new Error(d.error || 'Could not start the download.');
        job = d.job;
      }catch(e){
        if(e instanceof TypeError){ msg('Connection lost. Retrying...', true); await sleep(3000); }
        else throw e;
      }
    }
    while(!cancelled){
      let st;
      try{
        const r = await fetch('/api/status/' + job);
        if(r.status === 404){ // server restarted: restart job, partial files are reused
          await fetch('/api/prepare', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
          continue;
        }
        st = await r.json();
        msg('');
      }catch(e){
        msg('Connection lost. The server keeps downloading; reconnecting...', true);
        await sleep(3000); continue;
      }
      if(st.status === 'error') throw new Error(st.error || 'Download failed. Click Download to resume.');
      if(st.status === 'cancelled' || cancelled) throw new Error('Download cancelled by user.');
      if(st.status === 'done'){
        if(fileHandle){
          a.textContent = 'Saving...';
          msg('Saving file to your chosen folder...');
          const fileRes = await fetch('/api/file/' + job);
          if(!fileRes.ok) throw new Error('Failed to retrieve file from server.');
          const writable = await fileHandle.createWritable();
          await fileRes.body.pipeTo(writable);
          msg('Download complete! File saved to your chosen location.');
        } else {
          a.textContent = 'Saving...';
          const dlLink = document.createElement('a');
          dlLink.href = '/api/file/' + job;
          dlLink.download = suggestedName;
          document.body.appendChild(dlLink);
          dlLink.click();
          dlLink.remove();
          msg('Download started. (Tip: You can enable "Ask where to save each file before downloading" in your browser settings).');
        }
        break;
      }
      const pct = st.progress ? Math.floor(st.progress) + '%' : '';
      const eta = st.eta ? ' | ' + duration(st.eta) + ' left' : '';
      a.textContent = 'Preparing ' + pct;
      msg('Preparing your file ' + pct + eta);
      await sleep(1500);
    }
    if (cancelled) throw new Error('Download cancelled by user.');
  }catch(e){
    msg(e.message, true);
  }finally{
    c.removeEventListener('click', onCancel);
    c.style.display = 'none';
    setTimeout(() => { a.classList.remove('busy'); a.textContent = 'Download'; }, 1500);
  }
}

$('go').addEventListener('click', fetchInfo);
$('url').addEventListener('keydown', e => { if(e.key === 'Enter') fetchInfo(); });
</script>
</body>
</html>
