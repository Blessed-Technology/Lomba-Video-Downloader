services:
  - type: web
    name: lomba-video-downloader
    runtime: docker
    plan: free
    region: oregon
    envVars:
      - key: ALLOWED_HOSTS
        value: "*"
      - key: MAX_DURATION_SECONDS
        value: "0"
      - key: KEEP_HOURS
        value: "24"
    healthCheckPath: /api/health
