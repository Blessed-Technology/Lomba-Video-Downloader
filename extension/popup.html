<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <header style="display:flex;align-items:center;gap:10px;">
    <img src="../static/logo.png" alt="Lomba" style="width:28px;height:28px;object-fit:contain;">
    <h1 style="margin:0;font-size:18px;">Lomba</h1>
  </header>
  <div id="msg" role="status" aria-live="polite"></div>

  <section id="card" hidden>
    <img id="thumb" alt="">
    <div class="info">
      <h2 id="title"></h2>
      <p id="meta"></p>
    </div>
    <ul id="options"></ul>
  </section>

  <footer>
    <details>
      <summary>Server</summary>
      <div class="server">
        <input id="server" type="url" aria-label="Server address" placeholder="http://localhost:5000">
        <button id="save">Save</button>
      </div>
    </details>
  </footer>
  <script src="popup.js"></script>
</body>
</html>
